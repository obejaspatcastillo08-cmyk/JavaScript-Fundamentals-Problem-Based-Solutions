<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container py-5">
    <h1 class="text-center mb-2 title">Commute Carbon Tracker</h1>
    <p class="text-center subtitle">Track your eco impact in seconds</p>

        <div class="row g-3 mb-3">
            <div class="col-md-12">
                <input type="text" id="username" class="form-control input-style"
                       placeholder="Enter your name" oninput="updateName()">
            </div>
        </div>
        <div class="row g-3">
            <div class="col-md-4">
                <input type="number" id="distance" class="form-control input-style"
                       placeholder="Distance (km)">
            </div>

            <div class="col-md-4">
                <select id="mode" class="form-select input-style">
                    <option value="car"> Car</option>
                    <option value="bus"> Bus</option>
                    <option value="bike">Bike</option>
                    <option value="walk">Walk</option>
                </select>
            </div>
            <div class="col-md-4">
                <button class="btn btn-success w-100 btn-custom" onclick="addTrip()">
                    Add Trip
                </button>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card custom-card p-4 h-100">
                <h3>Daily Logs</h3>
                <ul id="loglist" class="list-group mt-3"></ul>
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-12">
            <div class="card summary-card p-4 text-center">
                <h4 id="greeting">Weekly Impact</h4>
                <p id="summary" class="summary-text">No data yet</p>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>

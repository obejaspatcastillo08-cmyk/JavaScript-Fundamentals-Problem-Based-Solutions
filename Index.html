<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commute Carbon Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <!-- TITLE -->
    <h1 class="text-center mb-2 title">
        🌱 Commute Carbon Tracker
    </h1>

    <p class="text-center subtitle">
        Track your transportation habits and discover how much carbon emissions you save by choosing eco-friendly travel.
    </p>

    <div class="row g-4">

        <!-- FORM SECTION -->
        <div class="col-lg-6">

            <div class="card custom-card p-4 h-100">

                <h4 class="mb-4">
                    Log Your Commute
                </h4>

                <!-- NAME -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Your Name
                    </label>

                    <input type="text"
                           id="username"
                           class="form-control input-style"
                           placeholder="Enter your name"
                           oninput="updateName()">

                </div>

                <!-- DISTANCE -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Distance Traveled
                    </label>

                    <input type="number"
                           id="distance"
                           class="form-control input-style"
                           placeholder="Distance (km)">

                    <small class="text-muted">
                        Enter how far you traveled today.
                    </small>

                </div>

                <!-- TRANSPORTATION -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Transportation Mode
                    </label>

                    <select id="mode" class="form-select input-style">

                        <option value="car">🚗 Car</option>
                        <option value="bus">🚌 Bus</option>
                        <option value="bike">🚴 Bike</option>
                        <option value="walk">🚶 Walk</option>

                    </select>

                </div>

                <!-- ADD BUTTON -->
                <button class="btn btn-success w-100 btn-custom mt-2"
                        onclick="addTrip()">

                    ➕ Add Trip

                </button>

                <!-- CLEAR BUTTON -->
                <button class="btn btn-outline-success w-100 mt-3"
                        onclick="clearTrips()">

                    🗑 Clear Logs

                </button>

            </div>

        </div>

        <!-- LOG SECTION -->
        <div class="col-lg-6">

            <div class="card custom-card p-4 h-100">

                <h4>
                    Daily Logs
                </h4>

                <!-- TODAY VS YESTERDAY COMPARISON -->
                <p id="comparisonText" class="text-muted small mt-2">
                    No comparison data yet.
                </p>

                <!-- LOG LIST -->
                <ul id="logList" class="list-group mt-3">

                    <li class="list-group-item text-center text-muted">
                        No trips added yet.
                    </li>

                </ul>

            </div>

        </div>

    </div>

    <!-- SUMMARY SECTION -->
    <div class="row mt-4">

        <div class="col-12">

            <div class="card summary-card p-4 text-center">

                <h4 id="greeting">
                    🌍 Weekly Impact
                </h4>

                <p id="summary" class="summary-text">
                    No data yet
                </p>

            </div>

        </div>

    </div>

</div>

<!-- External JavaScript -->
<script src="script.js"></script>

</body>
</html>
